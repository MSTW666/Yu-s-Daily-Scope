<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 705" font-family="Microsoft YaHei,PingFang SC,sans-serif"><title>小宇晨报深空蓝绿产品预览</title><rect x="0" y="0" width="960" height="705" rx="22" fill="#071016" stroke="#27444a"/><text x="30" y="40" font-size="22" fill="#edf3ef" >01  从主屏幕到原文</text><rect x="30" y="60" width="436" height="615" rx="18" fill="#0b222a" stroke="#27444a"/><rect x="482" y="60" width="448" height="615" rx="18" fill="#0b222a" stroke="#27444a"/><text x="55" y="95" font-size="14" fill="#63d3bf" >WEB / 完整简报</text><text x="510" y="95" font-size="14" fill="#63d3bf" >IPHONE / SCRIPTABLE</text><rect x="56" y="117" width="384" height="530" rx="25" fill="#08171d" stroke="#27444a"/><text x="78" y="157" font-size="25" fill="#edf3ef" >小宇，早上好。</text><text x="78" y="185" font-size="14" fill="#63d3bf" >我天没亮就醒了，替你翻了一遍。</text><rect x="76" y="207" width="344" height="92" rx="10" fill="#132a31" stroke="#27444a"/><text x="90" y="231" font-size="16" fill="#edf3ef" >索尼世界摄影奖 2027 开放组征集</text><text x="90" y="254" font-size="14" fill="#f1c489" >截止 11/10</text><text x="90" y="278" font-size="13" fill="#9db6b2" >五张单张即可投稿，学生组免报名费</text><rect x="76" y="310" width="344" height="92" rx="10" fill="#132a31" stroke="#27444a"/><text x="90" y="334" font-size="16" fill="#edf3ef" >「光的褶皱」杉本博司个展</text><text x="90" y="357" font-size="14" fill="#f1c489" >展至 11/15</text><text x="90" y="381" font-size="13" fill="#9db6b2" >上海摄影艺术中心，本周新增夜场</text><rect x="76" y="413" width="344" height="92" rx="10" fill="#132a31" stroke="#27444a"/><text x="90" y="437" font-size="16" fill="#edf3ef" >三影堂摄影奖 初选投稿</text><text x="90" y="460" font-size="14" fill="#f1c489" >截止 11/18</text><text x="90" y="484" font-size="13" fill="#9db6b2" >10–20 张组照，需附创作自述</text><rect x="76" y="516" width="344" height="92" rx="10" fill="#132a31" stroke="#27444a"/><text x="90" y="540" font-size="16" fill="#edf3ef" >城市切片 · 街头摄影工作坊</text><text x="90" y="563" font-size="14" fill="#f1c489" >11/12–11/15</text><text x="90" y="587" font-siz