name: YuDailyScope
options:
  bundleIdPrefix: com.mstw666
  deploymentTarget:
    iOS: '17.0'
targets:
  YuDailyScope:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mstw666.yudailyscope
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '0.2.0'
        CURRENT_PROJECT_VERSION: '3'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DailyScope
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: '5.0'
    dependencies:
      - target: YuWidgets
  YuWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mstw666.yudailyscope.widgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Info.plist
        SWIFT_VERSION: '5.0'
